# This is the neoforge.mods.toml file.
# It contains the data relating to the loading mods.
modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[dependencies."${mod_id}"]]
modId = "neoforge" # 'forge'가 아닌 'neoforge'로 변경
mandatory = true
versionRange = "[21.1,)" # NeoForge 1.21.1에 맞는 버전 범위 설정
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "farmersdelight"
mandatory = true
versionRange = "[1.2.10,)" # '1.21.1-' 접두사 제거
ordering = "AFTER"
side = "BOTH"
