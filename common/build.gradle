plugins {
    id 'net.neoforged.moddev' version '2.0.78'
}

neoForge {
    // Common 모듈은 실행 기능이 필요 없으므로 최소 설정만 합니다.
    version = rootProject.neoforge_version
}

dependencies {
    // 1.21.1 마인크래프트 라이브러리를 컴파일 시에만 참조합니다.
}

sourceSets.main.resources.srcDir 'src/generated/resources'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath

tasks.register('onggiInteractionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.potan.koreandelight.block.blockentity.OnggiInteractionTest'
    workingDir = layout.buildDirectory.get().asFile
    enableAssertions = true
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.named('check') { dependsOn 'onggiInteractionTest' }
